upstream paleo_api {
  server api:5000;
  keepalive 32;
}

upstream paleo_buyer {
  server buyer-storefront:3000;
  keepalive 16;
}

upstream paleo_vendor {
  server vendor-dashboard:80;
  keepalive 16;
}

upstream paleo_admin {
  server admin-console:80;
  keepalive 16;
}

upstream paleo_courier {
  server courier-web-view:80;
  keepalive 16;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location /api/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    proxy_pass http://paleo_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://paleo_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://paleo_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }

  location = /vendor {
    return 308 /vendor/;
  }

  location /vendor/ {
    rewrite ^/vendor/(.*)$ /$1 break;
    proxy_pass http://paleo_vendor;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 308 /admin/;
  }

  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    proxy_pass http://paleo_admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /courier {
    return 308 /courier/;
  }

  location /courier/ {
    rewrite ^/courier/(.*)$ /$1 break;
    proxy_pass http://paleo_courier;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://paleo_buyer;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
