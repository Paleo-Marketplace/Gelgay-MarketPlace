services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/paleo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      buyer-storefront:
        condition: service_started
      vendor-dashboard:
        condition: service_started
      admin-console:
        condition: service_started
      courier-web-view:
        condition: service_started
    networks: [paleo]

  buyer-storefront:
    build:
      context: ./apps/buyer-storefront
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${EDGE_PORT:-8080}
      NEXT_PUBLIC_SOCKET_URL: http://localhost:${EDGE_PORT:-8080}
    networks: [paleo]

  vendor-dashboard:
    build:
      context: .
      dockerfile: apps/vendor-dashboard/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${EDGE_PORT:-8080}
    networks: [paleo]

  admin-console:
    build:
      context: .
      dockerfile: apps/admin-console/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${EDGE_PORT:-8080}
    networks: [paleo]

  courier-web-view:
    build:
      context: .
      dockerfile: apps/courier-web-view/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${EDGE_PORT:-8080}
      VITE_SOCKET_URL: http://localhost:${EDGE_PORT:-8080}
    networks: [paleo]

  api:
    build:
      context: ./services/api-gateway
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      PUBLIC_API_URL: http://localhost:${EDGE_PORT:-8080}
      BUYER_STORE_URL: http://localhost:${EDGE_PORT:-8080}
      MONGO_URI: mongodb://mongo:27017/paleo?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      OCR_SERVICE_URL: http://receipt-parser:8000/parse-receipt
      ALLOWED_ORIGINS: http://localhost:${EDGE_PORT:-8080}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      typesense:
        condition: service_started
      receipt-parser:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [paleo]

  receipt-parser:
    build:
      context: .
      dockerfile: services/receipt-parser/Dockerfile
    networks: [paleo]

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks: [paleo]

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    command: >-
      mongosh --host mongo:27017 --eval
      "try { rs.status() } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"
    restart: "no"
    networks: [paleo]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [paleo]

  typesense:
    image: typesense/typesense:0.26.0
    command: >-
      --data-dir /data --api-key=${TYPESENSE_API_KEY:-replace-before-production}
      --enable-cors
    volumes:
      - typesense-data:/data
    networks: [paleo]

networks:
  paleo:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  typesense-data:
